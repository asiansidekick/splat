# Generate the Xcode project with XcodeGen: `brew install xcodegen && xcodegen`
name: Reset
options:
  bundleIdPrefix: com.asiansidekick
  deploymentTarget:
    iOS: "17.0"
targets:
  Reset:
    type: application
    platform: iOS
    sources: [Sources]
    # A shared scheme, so CI can archive the app for TestFlight.
    scheme: {}
    info:
      path: Info.plist
      properties:
        # Nearby sync (MultipeerConnectivity): phone to phone over Wi-Fi and Bluetooth.
        NSBonjourServices: [_reset-sync._tcp, _reset-sync._udp]
    settings:
      base:
        # Bundle IDs are unique across all of Apple; this one must match the App Store Connect app.
        PRODUCT_BUNDLE_IDENTIFIER: com.asiansidekick.reset
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Reset
        # No custom encryption, so TestFlight skips the export compliance question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Full screen only: the camera view and AR session do not suit iPad split view.
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Reset finds your teammates' phones nearby to sync references directly, with no internet."
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera records the set and shows the reference overlay."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Shutter photos and references are saved to Photos so you can send them."
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arkit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        SWIFT_VERSION: "5.9"
