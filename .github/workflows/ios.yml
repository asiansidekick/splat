name: iOS build

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    # Intel macOS runners: the arm64 pool repeatedly had no capacity for this repo.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        working-directory: ios/Reset
        run: |
          brew install xcodegen
          xcodegen

      - name: Build for device (unsigned)
        working-directory: ios/Reset
        run: |
          xcodebuild -project Reset.xcodeproj -target Reset -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build

      # Sideloading tools (AltStore, Sideloadly) sign this with the user's own Apple ID.
      - name: Package unsigned IPA
        working-directory: ios/Reset
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Reset.app Payload/
          zip -qr Reset-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Reset-unsigned-ipa
          path: ios/Reset/Reset-unsigned.ipa
