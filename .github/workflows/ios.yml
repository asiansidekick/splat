name: iOS build

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  # The 3D ghost's maths and depth reading, tested on a Mac with a synthetic room. Pictures of
  # what the ghost looks like are uploaded as the ghost-test-pictures artifact.
  test:
    runs-on: macos-15-intel
    timeout-minutes: 20
    # To push the test pictures to the ci/ghost-test-pictures branch, where they can be looked at.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ghost tests
        working-directory: ios/Reset
        run: |
          # Compiler errors and test results become annotations, so they show on the run summary.
          if ! swiftc -O Sources/DepthMap.swift Sources/GhostCore.swift Sources/ImageMatch.swift Tests/GhostTests/main.swift -o ghost-tests > compile.log 2>&1; then
            grep -E ": error: " compile.log | sort -u | head -10 \
              | sed -E 's#^.*/((Sources|Tests)/[^:]+):([0-9]+):([0-9]+): error: (.*)$#::error file=ios/Reset/\1,line=\3,col=\4::\5#'
            tail -40 compile.log
            exit 1
          fi
          set +e
          ./ghost-tests test-pictures > results.txt 2>&1
          status=$?
          set -e
          cat results.txt
          sed -nE 's/^FAIL  (.*)$/::error::\1/p; s/^PASS  (.*)$/::notice::\1/p' results.txt
          cp results.txt test-pictures/ 2>/dev/null || true
          exit $status
      - name: Publish test pictures
        if: always()
        # Only for reading the pictures; a failed upload must not hold back the app build.
        continue-on-error: true
        working-directory: ios/Reset
        run: |
          [ -d test-pictures ] || exit 0
          cd test-pictures
          git init -q
          git checkout -q -b ci/ghost-test-pictures
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Ghost test pictures for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci/ghost-test-pictures

  build:
    needs: test
    # Intel macOS runners: the arm64 pool repeatedly had no capacity for this repo.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        working-directory: ios/Reset
        run: |
          brew install xcodegen
          xcodegen

      - name: Build for device (unsigned)
        working-directory: ios/Reset
        run: |
          # Compiler errors become annotations, so they show on the run summary and in the PR.
          if ! xcodebuild -project Reset.xcodeproj -target Reset -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build > build.log 2>&1; then
            grep -E ": error: " build.log | sort -u | head -10 \
              | sed -E 's#^.*/(Sources/[^:]+):([0-9]+):([0-9]+): error: (.*)$#::error file=ios/Reset/\1,line=\2,col=\3::\4#'
            tail -60 build.log
            exit 1
          fi

      # Sideloading tools (AltStore, Sideloadly) sign this with the user's own Apple ID.
      # The build number is in the file name and on the app's home screen, so it is easy to tell
      # which build is installed.
      - name: Package unsigned IPA
        working-directory: ios/Reset
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Reset.app Payload/
          zip -qr "Reset-build-${{ github.run_number }}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Reset-build-${{ github.run_number }}
          path: ios/Reset/Reset-build-${{ github.run_number }}.ipa
