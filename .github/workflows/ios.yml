name: iOS build

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  # The 3D ghost's maths and depth reading, tested on a Mac with a synthetic room. Pictures of
  # what the ghost looks like are uploaded as the ghost-test-pictures artifact.
  test:
    runs-on: macos-15-intel
    timeout-minutes: 20
    # To push the test pictures to the ci/ghost-test-pictures branch, where they can be looked at.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ghost tests
        working-directory: ios/Reset
        run: |
          # Compiler errors and test results become annotations, so they show on the run summary.
          if ! swiftc -O Sources/DepthMap.swift Sources/CornerSnap.swift Sources/FeatureTrack.swift Sources/PaperPose.swift Sources/DepthMesh.swift Sources/ScanClean.swift Sources/GhostCore.swift Sources/ImageMatch.swift Sources/EdgeGuide.swift Tests/GhostTests/main.swift -o ghost-tests > compile.log 2>&1; then
            grep -E ": error: " compile.log | sort -u | head -10 \
              | sed -E 's#^(.*/)?((Sources|Tests)/[^:]+):([0-9]+):([0-9]+): error: (.*)$#::error file=ios/Reset/\2,line=\4,col=\5::\6#'
            tail -40 compile.log
            exit 1
          fi
          set +e
          ./ghost-tests test-pictures > results.txt 2>&1
          status=$?
          set -e
          cat results.txt
          sed -nE 's/^FAIL  (.*)$/::error::\1/p; s/^PASS  (.*)$/::notice::\1/p' results.txt
          cp results.txt test-pictures/ 2>/dev/null || true
          exit $status
      - name: Sync tests
        working-directory: ios/Reset
        run: |
          if ! swiftc -O Sources/ReferenceModel.swift Sources/MannequinPose.swift Sources/PosePresets.swift Sources/RigMap.swift Sources/HumanLimits.swift Sources/PoseDrag.swift Sources/PoseAxes.swift Sources/PoseFromBody.swift Sources/CallSheet.swift Sources/Cutout.swift Sources/FrameMath.swift Sources/ReferenceSync.swift Sources/Shared/PhotoPrivacy.swift \
            Sources/Shared/SecurePack.swift Sources/Shared/SyncEngine.swift Tests/SyncTests/PoseLimitTests.swift Tests/SyncTests/PoseAxesTests.swift Tests/SyncTests/PoseCopyTests.swift Tests/SyncTests/main.swift -o sync-tests > sync-compile.log 2>&1; then
            grep -E ": error: " sync-compile.log | sort -u | head -10 \
              | sed -E 's#^.*/((Sources|Tests)/[^:]+):([0-9]+):([0-9]+): error: (.*)$#::error file=ios/Reset/\1,line=\3,col=\4::\5#'
            grep -E "error:" sync-compile.log | sort -u | head -10 | sed -E 's#^#::error::#'
            tail -40 sync-compile.log
            exit 1
          fi
          set +e
          ./sync-tests > sync-results.txt 2>&1
          status=$?
          set -e
          cat sync-results.txt
          sed -nE 's/^FAIL  (.*)$/::error::\1/p' sync-results.txt
          [ $status -eq 0 ] || tail -5 sync-results.txt | sed -E 's#^#::error::sync tests ended: #'
          exit $status
      - name: Crop tests
        working-directory: ios/Reset
        run: |
          # Object scan: auto-crop maths (floor and object finding) on synthetic scans.
          if ! swiftc -O Sources/CropMath.swift Sources/ScanAlign.swift Sources/TrimMath.swift Sources/PinMath.swift Sources/OccluderMath.swift Sources/EdgeLayoutMath.swift Sources/HeadMath.swift Tests/CropTests/main.swift -o crop-tests > crop-compile.log 2>&1; then
            grep -E ": error: " crop-compile.log | sort -u | head -10 \
              | sed -E 's#^(.*/)?((Sources|Tests)/[^:]+):([0-9]+):([0-9]+): error: (.*)$#::error file=ios/Reset/\2,line=\4,col=\5::\6#'
            tail -40 crop-compile.log
            exit 1
          fi
          set +e
          ./crop-tests > crop-results.txt 2>&1
          status=$?
          set -e
          cat crop-results.txt
          sed -nE 's/^FAIL  (.*)$/::error::\1/p' crop-results.txt
          exit $status
      - name: Scan person tests
        working-directory: ios/Reset
        run: |
          # A synthetic scanned person turned into a posable FBX character, read back with Reset's own FBX reader.
          clang -O2 -c Sources/FBX/ufbx.c -o ufbx.o
          clang -O2 -c Sources/FBX/FBXShim.c -o fbxshim.o
          if ! swiftc -O -import-objc-header Sources/FBX/FBXShim.h Sources/ReferenceModel.swift Sources/MannequinPose.swift Sources/PosePresets.swift Sources/RigMap.swift Sources/HumanLimits.swift Sources/CallSheet.swift Sources/Cutout.swift \
            Sources/FrameMath.swift Sources/ReferenceSync.swift Sources/Shared/PhotoPrivacy.swift Sources/Shared/SecurePack.swift Sources/Shared/SyncEngine.swift \
            Sources/ScanRig.swift Sources/ScanRigClean.swift Tests/ScanPersonTests/main.swift ufbx.o fbxshim.o -o scan-person-tests > person-compile.log 2>&1; then
            grep -E ": error: " person-compile.log | sort -u | head -10 \
              | sed -E 's#^(.*/)?((Sources|Tests)/[^:]+):([0-9]+):([0-9]+): error: (.*)$#::error file=ios/Reset/\2,line=\4,col=\5::\6#'
            tail -40 person-compile.log
            exit 1
          fi
          set +e
          ./scan-person-tests > person-results.txt 2>&1
          status=$?
          set -e
          cat person-results.txt
          sed -nE 's/^FAIL  (.*)$/::error::\1/p' person-results.txt
          exit $status
      - name: Publish test pictures
        if: always()
        # Only for reading the pictures; a failed upload must not hold back the app build.
        continue-on-error: true
        working-directory: ios/Reset
        run: |
          [ -d test-pictures ] || exit 0
          cd test-pictures
          git init -q
          git checkout -q -b ci/ghost-test-pictures
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Ghost test pictures for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci/ghost-test-pictures

  build:
    needs: test
    # Intel macOS runners: the arm64 pool repeatedly had no capacity for this repo.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache the depth model
        uses: actions/cache@v4
        with:
          path: ios/Reset/Models
          key: depth-anything-v2-small-f16
      - name: Fetch the depth model
        run: python3 .github/scripts/fetch_depth_model.py
      - name: Metal toolchain
        run: |
          # Xcode 26 no longer ships the Metal compiler in the app; Storyboard.metal needs it.
          if ! xcrun metal --version >/dev/null 2>&1; then
            for n in 1 2 3; do xcodebuild -downloadComponent MetalToolchain && break || sleep 30; done
          fi
      - name: Generate Xcode project
        working-directory: ios/Reset
        run: |
          brew install xcodegen
          xcodegen

      - name: Build for device (unsigned)
        working-directory: ios/Reset
        run: |
          # Compiler errors become annotations, so they show on the run summary and in the PR.
          if ! xcodebuild -project Reset.xcodeproj -target Reset -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build > build.log 2>&1; then
            grep -E ": error: " build.log | sort -u | head -10 \
              | sed -E 's#^.*/(Sources/[^:]+):([0-9]+):([0-9]+): error: (.*)$#::error file=ios/Reset/\1,line=\2,col=\3::\4#'
            tail -60 build.log
            exit 1
          fi

      # Sideloading tools (AltStore, Sideloadly) sign this with the user's own Apple ID.
      # The build number is in the file name and on the app's home screen, so it is easy to tell
      # which build is installed.
      - name: Package unsigned IPA
        working-directory: ios/Reset
        run: |
          # Storyboard needs both Metal libraries: its Core Image kernels and the live look's shaders.
          ls -l build/Release-iphoneos/Reset.app/*.metallib
          if [ ! -f build/Release-iphoneos/Reset.app/Storyboard.ci.metallib ]; then
            echo "::error::Storyboard.ci.metallib is missing from the app (Core Image build rule in project.yml)"
            exit 1
          fi
          mkdir -p Payload
          cp -R build/Release-iphoneos/Reset.app Payload/
          zip -qr "Reset-build-${{ github.run_number }}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Reset-build-${{ github.run_number }}
          path: ios/Reset/Reset-build-${{ github.run_number }}.ipa
