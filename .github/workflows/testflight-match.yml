name: TestFlight (Match)

# Builds the Match app, signs it with Apple's cloud signing and uploads it to TestFlight, the same
# way as Reset. Off until the APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 secrets exist,
# and it waits (without failing) until Match's App Store Connect app has been created.
on:
  push:
    branches: [main, claude/project-thread-n74c0v]
    paths: ["ios/Match/**", ".github/workflows/testflight-match.yml", ".github/scripts/asc_check_match.py"]
  workflow_dispatch:

concurrency:
  group: testflight-match

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TestFlight upload is off: add the APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 repository secrets to turn it on."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  upload:
    needs: check
    if: needs.check.outputs.ready == 'true'
    # Intel macOS runners: the arm64 pool repeatedly had no capacity for this repo.
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # The ID Sideloadly registered for Phil's phone (team ID on the end): TestFlight installs over that
      # copy and keeps its boards. The sideloaded .ipa keeps com.asiansidekick.match.
      BUNDLE_ID: com.asiansidekick.match.K2LQWV85T9
    steps:
      - uses: actions/checkout@v4

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # Registers the bundle ID if new. Exit 3 means the App Store Connect app is still to be made by
      # hand (Apple only allows that on the website): the rest is skipped, and the run stays green.
      - name: Check the bundle ID and App Store Connect app
        id: asc
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          set +e
          python3 .github/scripts/asc_check_match.py
          status=$?
          if [ "$status" = "0" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "3" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

      # Apple only accepts uploads built with the iOS 26 SDK (Xcode 26) or later.
      - name: Select Xcode 26 or later
        if: steps.asc.outputs.go == 'true'
        run: |
          ls -d /Applications/Xcode*.app || true
          best=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|_rc|candidate' | sed -E 's#.*/Xcode_([0-9.]+)(_[A-Za-z0-9]+)?\.app#\1 &#' | awk '$1 >= 26' | sort -V | tail -1 | cut -d' ' -f2-)
          if [ -z "$best" ]; then
            echo "::error::No Xcode 26 or later on this runner. Installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi
          echo "Using $best"
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Generate Xcode project
        if: steps.asc.outputs.go == 'true'
        working-directory: ios/Match
        run: |
          brew install xcodegen
          xcodegen

      # Archived unsigned; the export step signs it with a cloud-managed distribution certificate,
      # so no certificate or profile has to be stored in GitHub.
      - name: Archive
        if: steps.asc.outputs.go == 'true'
        working-directory: ios/Match
        run: |
          if ! xcodebuild -project Match.xcodeproj -scheme Match -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/Match.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO archive > archive.log 2>&1; then
            grep -E "error:" archive.log | sort -u | head -10 | sed -E 's/^/::error::/'
            tail -60 archive.log
            exit 1
          fi

      - name: Sign and upload to TestFlight
        if: steps.asc.outputs.go == 'true'
        working-directory: ios/Match
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          if ! xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Match.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1; then
            grep -iE "error" export.log | sort -u | head -10 | sed -E 's/^/::error::/'
            tail -60 export.log
            exit 1
          fi
          echo "::notice::Match build ${{ github.run_number }} uploaded. It shows in TestFlight after Apple processes it, usually 5 to 30 minutes."

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
