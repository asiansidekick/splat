name: iOS Scan build

# The Scan test app (ios/Scan): Apple Object Capture, separate from Reset.
on:
  push:
    paths: ["ios/Scan/**", ".github/workflows/ios-scan.yml"]
  pull_request:
    paths: ["ios/Scan/**", ".github/workflows/ios-scan.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: ios/Scan
        run: |
          brew install xcodegen
          xcodegen
      - name: Build for device (unsigned)
        working-directory: ios/Scan
        run: |
          if ! xcodebuild -project Scan.xcodeproj -target Scan -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build > build.log 2>&1; then
            grep -E ": error: " build.log | sort -u | head -10 \
              | sed -E 's#^.*/(Sources/[^:]+):([0-9]+):([0-9]+): error: (.*)$#::error file=ios/Scan/\1,line=\2,col=\3::\4#'
            tail -60 build.log
            exit 1
          fi
          grep -E ": warning: " build.log | grep "/Sources/" | sort -u | head -10 \
            | sed -E 's#^.*/(Sources/[^:]+):([0-9]+):([0-9]+): warning: (.*)$#::warning file=ios/Scan/\1,line=\2,col=\3::\4#' || true
      - name: Package unsigned IPA
        working-directory: ios/Scan
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Scan.app Payload/
          zip -qr "Scan-build-${{ github.run_number }}.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Scan-build-${{ github.run_number }}
          path: ios/Scan/Scan-build-${{ github.run_number }}.ipa
